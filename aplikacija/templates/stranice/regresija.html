{% extends 'base.html' %}

{% block head %}

{% endblock %}

{% block body %}
<h2>Procena cene</h2>

<!-- 1. Izbor kategorije (GET, osvezava stranicu) -->
<form method="get" action="/regresija">
    <select name="kategorija" onchange="this.form.submit()">
        <option value=""> -- izaberi kategoriju -- </option>
        {% for k in kategorije %}
            <option value="{{k}}" {% if k == izabrana %} selected {% endif %}> {{k}} </option>
        {% endfor %}
    </select>
    <button type="submit"> Prikazi </button>
</form>

{% if model %}
<form method="post" action="/regresija">
    <input type="hidden" name="kategorija" value="{{ izabrana }}">
    {% for polje, medijana in model.medijane.items() %}
        <label>
            {{ polje }}
            <input type="number" step="any" name="{{ polje }}" placeholder="{{ medijana }}">
        </label><br>
    {% endfor %}

    {% for polje, opcije in model.opcije.items() %}
        <label>
            {{ polje }}
            <select name="{{ polje }}">
                {% for o in opcije %}
                    <option> {{ o }} </option>
                {% endfor %}
            </select>
        </label><br>
    {% endfor %}

    <button type="submit">Izračunaj</button>

</form>
{% endif %}

<h3>Procenjena cena: {{ rezultat }} RSD</h3>


{% endblock %}
