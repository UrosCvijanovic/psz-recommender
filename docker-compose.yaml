services:
  db:
    image: postgres:17
    container_name: local_pgdb
    ports:
     - "5432:5432"
    environment:
      POSTGRES_DB: psz
      POSTGRES_USER: uros
      POSTGRES_PASSWORD: n21wVyLRCCckFotr
    
    volumes:
      - pgdb-data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin4_container
    ports:
      - "8888:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: uros@domain-name.com
      PGADMIN_DEFAULT_PASSWORD: n21wVyLRCCckFotr
    volumes:
      - pgadmin-data:/var/lib/pgadmin

volumes:
  pgdb-data:
  pgadmin-data:
